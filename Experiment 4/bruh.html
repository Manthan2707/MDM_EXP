<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Translator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 90%; max-width: 450px; }
        h2 { margin: 0 0 10px; color: #1a73e8; text-align: center; }
        p { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 5px solid #1a73e8; line-height: 1.5; color: #3c4043; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 12px; color: #70757a; }
        select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #dadce0; border-radius: 6px; background: white; font-size: 14px; }
        button { width: 100%; margin-top: 20px; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1557b0; }
        .loader { font-size: 12px; color: #1a73e8; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Global Reader</h2>
    <p id="text-to-translate">
        Welcome! This system is designed to provide information to every citizen in the world. 
        Once you select your country and state, we will generate a translated version of this page 
        specifically for your regional language.
    </p>

    <label>1. SELECT COUNTRY</label>
    <select id="country"><option>Loading world data...</option></select>

    <label>2. SELECT STATE / PROVINCE</label>
    <select id="state" disabled><option>Select country first</option></select>

    <label>3. SELECT LANGUAGE</label>
    <select id="lang" disabled><option>Select state first</option></select>

    <button onclick="startTranslation()">Translate Now</button>
    <div id="loading" class="loader">Preparing translation...</div>
</div>

<script>
    const countryEl = document.getElementById('country');
    const stateEl = document.getElementById('state');
    const langEl = document.getElementById('lang');
    let worldData = [];

    // 1. Load All Countries & States (Live Global Database)
    fetch("https://countriesnow.space/api/v0.1/countries/states")
        .then(res => res.json())
        .then(data => {
            worldData = data.data;
            countryEl.innerHTML = '<option value="">-- Choose Country --</option>' + 
                worldData.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        });

    // 2. Update States & Fetch Official Languages
    countryEl.onchange = async () => {
        const country = countryEl.value;
        const found = worldData.find(c => c.name === country);
        
        stateEl.innerHTML = '<option value="">-- Choose State --</option>' + 
            found.states.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        stateEl.disabled = false;

        // Fetch precise languages for the country
        const res = await fetch(`https://restcountries.com/v3.1/name/${country}?fullText=true`);
        const json = await res.json();
        const languages = json[0].languages; // e.g. {hin: "Hindi", eng: "English"}
        
        langEl.innerHTML = '<option value="">-- Choose Language --</option>' + 
            Object.entries(languages).map(([code, name]) => `<option value="${code}">${name}</option>`).join('');
        langEl.disabled = false;
    };

    // 3. Reliable Translation Trigger
    function startTranslation() {
        const langCode = langEl.value;
        if (!langCode) return alert("Please select a language first!");
        
        document.getElementById('loading').style.display = 'block';
        
        // This method creates a Google Translate wrapper that works even on local files
        const currentUrl = window.location.href;
        const translateUrl = `https://translate.google.com/translate?sl=en&tl=${langCode}&u=${encodeURIComponent(currentUrl)}`;
        
        window.location.href = translateUrl;
    }
</script>

</body>
</html>
