<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px
        }

        input {
            padding: 8px;
            width: 80%;
            margin-bottom: 10px
        }

        button {
            padding: 8px 15px;
            cursor: pointer
        }

        .result {
            margin-top: 15px
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Weather App</h2>
        <input type="text" id="city" placeholder="Enter city name">
        <br>
        <button onclick="getWeather()">Get Weather</button>
        <div class="result">
            <p id="temperature"></p>
            <p id="humidity"></p>
            <p id="condition"></p>
        </div>
    </div>
    <script>
        function getWeather() {
            var city = document.getElementById("city").value;
            var apiKey = "e8454e1be6dca3fbd1ed5f426aea8e23";
            var url = "https://api.openweathermap.org/data/2.5/weather?q=" + city + "&appid=" + apiKey + "&units=metric";
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById("temperature").innerHTML = "Temperature: " + data.main.temp + " °C";
                    document.getElementById("humidity").innerHTML = "Humidity: " + data.main.humidity + " %";
                    document.getElementById("condition").innerHTML = "Condition: " + data.weather[0].description;
                } else {
                    document.getElementById("temperature").innerHTML = "City not found";
                    document.getElementById("humidity").innerHTML = "";
                    document.getElementById("condition").innerHTML = "";
                }
            };
            xhr.send();
        }
    </script>
</body>

</html>
